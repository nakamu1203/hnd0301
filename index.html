<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現代文 マーク式解答確認・送信</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --correct: #16a34a;
      --wrong: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 640px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.sub { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="number"], input[type="file"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
    }
    .preview-box { text-align: center; margin: 12px 0; }
    .preview-box img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid var(--border); display: none; margin: 0 auto; }
    
    /* 採点サマリー */
    .score-banner {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .score-banner span { font-weight: 600; font-size: 0.95rem; }
    .score-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

    /* 解答確認グリッド */
    .table-container { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: #f1f5f9; padding: 10px; font-weight: 600; text-align: center; border-bottom: 1px solid var(--border); }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .q-info { text-align: center; font-weight: 600; width: 70px; }
    .point-tag { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; }
    .options { display: flex; gap: 6px; justify-content: center; }
    .opt-btn {
      width: 34px; height: 34px; border: 1px solid var(--border); background: #ffffff;
      border-radius: 50%; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
    }
    .opt-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .result-badge { width: 40px; text-align: center; font-weight: 700; }
    .is-correct { color: var(--correct); }
    .is-wrong { color: var(--wrong); }

    /* 送信ボタン */
    .submit-btn {
      width: 100%; background: var(--primary); color: #fff; border: none; padding: 14px;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .status-msg { margin-top: 12px; font-size: 0.875rem; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h1>マーク式解答確認</h1>
  <p class="sub">センター試験 1994本試 現代文（全18問・100点満点）</p>

  <div class="form-group">
    <label for="studentNo">出席番号（半角数字）</label>
    <input type="number" id="studentNo" placeholder="例: 12" min="1" max="99" required>
  </div>

  <div class="form-group">
    <label for="sheetImage">マークシート画像の読み取り</label>
    <input type="file" id="sheetImage" accept="image/*" capture="environment">
    <div class="preview-box">
      <img id="imgPreview" alt="アップロードプレビュー">
    </div>
  </div>

  <div class="score-banner">
    <span>現在の自己採点合計:</span>
    <div><span class="score-value" id="currentScore">0</span> / 100 点</div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>設問 (配点)</th>
          <th>選択マーク (①〜⑤)</th>
          <th>正否</th>
        </tr>
      </thead>
      <tbody id="questionRows"></tbody>
    </table>
  </div>

  <button class="submit-btn" id="submitBtn">この内容で結果を送信する</button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
  // スプレッドシートから読み込んだ配点・模範解答データ
  const QUESTION_DATA = [
    { no: 1,  ans: 3, score: 2 },
    { no: 2,  ans: 4, score: 2 },
    { no: 3,  ans: 5, score: 2 },
    { no: 4,  ans: 2, score: 2 },
    { no: 5,  ans: 1, score: 2 },
    { no: 6,  ans: 4, score: 8 },
    { no: 7,  ans: 4, score: 7 },
    { no: 8,  ans: 5, score: 7 },
    { no: 9,  ans: 3, score: 8 },
    { no: 10, ans: 2, score: 10 },
    { no: 11, ans: 1, score: 4 },
    { no: 12, ans: 4, score: 4 },
    { no: 13, ans: 2, score: 4 },
    { no: 14, ans: 5, score: 7 },
    { no: 15, ans: 1, score: 8 },
    { no: 16, ans: 4, score: 7 },
    { no: 17, ans: 4, score: 8 },
    { no: 18, ans: 3, score: 8 }
  ];

  // 生徒の選択状態を保持（問番号: 選択値）
  const userAnswers = {};

  // テーブルの生成
  const tbody = document.getElementById('questionRows');
  QUESTION_DATA.forEach(q => {
    const tr = document.createElement('tr');
    
    // 設問番号 & 配点
    const tdInfo = document.createElement('td');
    tdInfo.className = 'q-info';
    tdInfo.innerHTML = `問${q.no} <span class="point-tag">(${q.score}点)</span>`;
    tr.appendChild(tdInfo);

    // 選択肢 (1〜5)
    const tdOpts = document.createElement('td');
    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    for (let c = 1; c <= 5; c++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-btn';
      btn.textContent = ['①','②','③','④','⑤'][c - 1];
      btn.dataset.question = q.no;
      btn.dataset.val = c;
      btn.addEventListener('click', () => {
        selectChoice(q.no, c);
      });
      optsDiv.appendChild(btn);
    }
    tdOpts.appendChild(optsDiv);
    tr.appendChild(tdOpts);

    // 正否バッジ
    const tdRes = document.createElement('td');
    tdRes.className = 'result-badge';
    tdRes.id = `result-${q.no}`;
    tdRes.textContent = '-';
    tr.appendChild(tdRes);

    tbody.appendChild(tr);
  });

  // 選択肢の変更・再計算処理
  function selectChoice(questionNo, choiceVal) {
    userAnswers[questionNo] = choiceVal;

    // ボタンのアクティブ更新
    const rowBtns = document.querySelectorAll(`button[data-question="${questionNo}"]`);
    rowBtns.forEach(btn => {
      if (parseInt(btn.dataset.val) === choiceVal) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    calculateScore();
  }

  // 採点計算
  function calculateScore() {
    let total = 0;
    QUESTION_DATA.forEach(q => {
      const selected = userAnswers[q.no];
      const resCell = document.getElementById(`result-${q.no}`);
      if (selected !== undefined) {
        if (selected === q.ans) {
          total += q.score;
          resCell.textContent = '○';
          resCell.className = 'result-badge is-correct';
        } else {
          resCell.textContent = '×';
          resCell.className = 'result-badge is-wrong';
        }
      } else {
        resCell.textContent = '-';
        resCell.className = 'result-badge';
      }
    });
    document.getElementById('currentScore').textContent = total;
  }

  // 画像アップロード時のプレビュー＆自動判定処理枠
  document.getElementById('sheetImage').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = document.getElementById('imgPreview');
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';

    // 注: 完全クライアントサイドでの高精度マークシートOCRは撮影歪みに影響されやすいため、
    // ここでは初期枠としてプレビューを表示し、生徒が上の表をワンタップで確認・修正できるようにしています。
  });

  // 送信処理（Google Apps ScriptのエンドポイントまたはWebHookにPOST）
  // 以下のURLをデプロイしたGoogle Apps ScriptのWebアプリURLに差し替えてください。
  const GAS_ENDPOINT_URL = "YOUR_GAS_WEBAPP_URL_HERE";

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const studentNo = document.getElementById('studentNo').value;
    const statusMsg = document.getElementById('statusMsg');

    if (!studentNo) {
      alert('出席番号を入力してください。');
      return;
    }

    const currentScore = parseInt(document.getElementById('currentScore').textContent);
    const payload = {
      studentNo: studentNo,
      score: currentScore,
      answers: userAnswers,
      timestamp: new Date().toISOString()
    };

    statusMsg.style.color = '#2563eb';
    statusMsg.textContent = '送信中...';

    // GASエンドポイントが未設定の場合はローカルダウンロード/確認モードとして動作
    if (GAS_ENDPOINT_URL === https://script.google.com/macros/s/AKfycbznhvWGu-pFm6gYsTpuq_llVwsEvSwhj4PCt-XAv_hhSqLehUG0ZCFtyoxCROIMhacP/exec) {
      setTimeout(() => {
        statusMsg.style.color = '#16a34a';
        statusMsg.textContent = `【テスト完了】番号 ${studentNo} 番: ${currentScore}点 で記録しました（※本番送信にはGAS URLの設定が必要です）。`;
        console.log("送信ペイロード:", payload);
      }, 500);
      return;
    }

    try {
      await fetch(GAS_ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      statusMsg.style.color = '#16a34a';
      statusMsg.textContent = `出席番号 ${studentNo} 番の結果（${currentScore}点）を送信完了しました。`;
    } catch (err) {
      statusMsg.style.color = '#dc2626';
      statusMsg.textContent = '送信に失敗しました。時間をおいて再試行してください。';
    }
  });
</script>
</body>
</html>
